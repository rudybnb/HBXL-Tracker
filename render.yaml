services:
  # Node.js + React Frontend Service
  - type: web
    name: erdesignandbuild-web
    runtime: node
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: erdesignandbuild-db
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: ELEVEN_API_KEY
        sync: false
      - key: ELEVEN_VOICE_ID
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    healthCheckPath: /api/health
    autoDeploy: true

  # Python FastAPI Service (Telegram Bot API)
  - type: web
    name: erdesignandbuild-telegram-api
    runtime: python
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erdesignandbuild-db
          property: connectionString
      - key: PYTHON_ENV
        value: production
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: erdesignandbuild-db
    databaseName: erdesignandbuild
    user: erdesignandbuild
